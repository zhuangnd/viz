<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="中国大陆居民赴日 15–20 日自助旅行规划工具：路线地图可视化、行程时间轴、预算计算器。面向首次赴日游客，公共交通为主。">
<title>日本 15–20 日旅行规划 · 地图 × 行程 × 预算</title>
<style>
/* ========== 设计系统：和纸与墨 ========== */
:root{
  --paper:#FAF8F4; --sumi:#1C1A17; --sumi-light:#6B665C; --washi:#fff;
  --shu:#C1362F; --shu-soft:#E8A9A4;
  --matcha:#6E8B5A; --ai:#3E6B8A; --gold:#B8912F;
  --line:#E3DED4; --line-strong:#CFC7B8;
  --f-serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --f-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --accent:var(--ai);
  --accent-soft:rgba(62,107,138,.1);
  --shadow:0 1px 3px rgba(28,26,23,.06),0 6px 18px rgba(28,26,23,.05);
  --r:5px;
  --nav-w:280px;
  --bar-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--f-sans);background:var(--paper);color:var(--sumi);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-serif);font-weight:600;line-height:1.3;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px;border-radius:3px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ========== 顶栏 ========== */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(250,248,244,.94);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1600px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--f-serif);font-size:17px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand-mark{width:9px;height:9px;background:var(--shu);border-radius:50%;flex:none}
.brand small{font-family:var(--f-sans);font-size:10px;font-weight:400;color:var(--sumi-light);letter-spacing:.06em;display:block;line-height:1.2}
.ctrls{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.seg{display:flex;background:var(--washi);border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{padding:6px 13px;font-size:13px;color:var(--sumi-light);border-right:1px solid var(--line);transition:.18s;white-space:nowrap}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.seg button:not([aria-pressed="true"]):hover{background:var(--paper);color:var(--sumi)}
.seg-lab{font-size:11px;color:var(--sumi-light);margin-right:-8px;letter-spacing:.04em}

.sel{padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--washi);font-size:13px;color:var(--sumi)}
.verified{font-size:11px;color:var(--sumi-light);white-space:nowrap;letter-spacing:.02em}
.verified b{color:var(--shu);font-weight:600}

/* ========== 布局 ========== */
.wrap{max-width:1600px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:var(--nav-w) 1fr;gap:28px;align-items:start}
.side{position:sticky;top:74px;max-height:calc(100vh - 92px);overflow-y:auto;padding:22px 4px 40px;scrollbar-width:thin}
.main{padding:22px 0 90px;min-width:0}

.side-h{font-size:10px;letter-spacing:.16em;color:var(--sumi-light);text-transform:uppercase;margin:0 0 9px;font-weight:600}
.navlist{display:flex;flex-direction:column;gap:1px;margin-bottom:24px}
.navlist button{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r);
  font-size:13.5px;color:var(--sumi-light);text-align:left;transition:.16s;width:100%;
}
.navlist button:hover{background:var(--washi);color:var(--sumi)}
.navlist button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlist .ic{font-size:13px;width:16px;text-align:center;flex:none}
.navlist .ct{margin-left:auto;font-size:10px;background:var(--line);padding:1px 6px;border-radius:9px;color:var(--sumi-light);font-family:var(--f-mono)}
.navlist button[aria-selected="true"] .ct{background:var(--accent);color:#fff}

/* ========== 侧栏：路线卡 ========== */
.rlist{display:flex;flex-direction:column;gap:5px}
.rcard{
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--washi);
  text-align:left;transition:.16s;width:100%;position:relative;overflow:hidden;
}
.rcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc,#999)}
.rcard:hover{border-color:var(--line-strong);transform:translateX(2px)}
.rcard[aria-pressed="true"]{border-color:var(--rc);background:var(--accent-soft)}
.rc-n{font-size:12.5px;font-weight:600;line-height:1.35;display:flex;gap:6px;align-items:baseline}
.rc-n .tag{font-size:9.5px;padding:1px 5px;border-radius:3px;background:var(--rc);color:#fff;font-weight:500;flex:none}
.rc-m{font-size:10.5px;color:var(--sumi-light);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.rc-add{margin-left:auto}

/* ========== 卡片/面板 ========== */
.card{background:var(--washi);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.hero{padding:26px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}
.hero h1{font-size:27px;margin-bottom:9px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--sumi-light);font-size:14px;max-width:70ch}
.hero-stats{display:flex;gap:26px;margin-top:17px;flex-wrap:wrap}
.hstat b{font-family:var(--f-mono);font-size:18px;display:block;line-height:1.2}
.hstat span{font-size:11px;color:var(--sumi-light)}

.panel{background:var(--washi);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.phead{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:linear-gradient(180deg,#fff,var(--paper))}
.phead h3{font-size:16px}
.phead .sub{font-size:11.5px;color:var(--sumi-light);margin-left:auto}
.pbody{padding:18px 20px}

/* ========== 季节提示 ========== */
.alert{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px;line-height:1.6;border:1px solid}
.alert .ai{flex:none;font-size:15px;line-height:1.4}
.alert b{font-weight:600}
.a-warn{background:#FFF8EC;border-color:#EAD3A8;color:#7A5518}
.a-dang{background:#FDF0EF;border-color:#F0C4C0;color:#8C2A24}
.a-tip{background:#F1F6EC;border-color:#CBDEBE;color:#456030}
.a-info{background:#EEF3F8;border-color:#C3D4E4;color:#2C5470}

/* ========== 地图 ========== */
.mapbox{position:relative;background:linear-gradient(170deg,#EDF2F5,#E3EAEE);border-bottom:1px solid var(--line);overflow:hidden}
#map{display:block;width:100%;height:520px;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.map-ovl{position:absolute;top:11px;left:11px;display:flex;flex-direction:row;flex-wrap:wrap;gap:5px;z-index:20;max-width:calc(100% - 90px)}
.map-ovl-r{position:absolute;top:11px;right:11px;display:flex;gap:5px;z-index:20;flex-wrap:wrap;justify-content:flex-end}
.mbtn{background:rgba(255,255,255,.95);border:1px solid var(--line-strong);border-radius:var(--r);padding:5px 10px;font-size:11.5px;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:.15s}
.mbtn:hover{background:#fff;border-color:var(--sumi-light)}
.mbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{position:absolute;bottom:11px;left:11px;background:rgba(255,255,255,.95);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 12px;font-size:11px;z-index:5;max-width:min(300px,calc(100% - 22px));box-shadow:0 1px 4px rgba(0,0,0,.08)}
.legend h4{font-size:10px;letter-spacing:.08em;color:var(--sumi-light);margin-bottom:5px;font-family:var(--f-sans);font-weight:600}
.legend .lg{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--sumi-light)}
.legend .sw{width:15px;height:3px;border-radius:2px;flex:none}
.legend .sw.dot{width:8px;height:8px;border-radius:50%}

/* 地图元素 */
.land{fill:#fff;stroke:#B9C6CE;stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pref{fill:none;stroke:#D8E0E5;stroke-width:.7}
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;transition:stroke-width .2s,opacity .2s;opacity:.55;vector-effect:non-scaling-stroke}
.rt.on{opacity:1;stroke-width:3}
.rt:hover{opacity:1;stroke-width:4.5}
.band{opacity:.2;pointer-events:none;vector-effect:non-scaling-stroke}

/* ---------- 标记覆盖层：尺寸恒定，不随地图缩放 ---------- */
.marks{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.marker{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;cursor:pointer;will-change:transform}
.marker .mk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:block;border-radius:50%;pointer-events:auto}
.marker:focus-visible{outline:none}
.marker:focus-visible .mk{box-shadow:0 0 0 3px rgba(193,54,47,.45)}
.mk-city{width:9px;height:9px;background:#fff;border:2px solid var(--sumi)}
.mk-city.port{width:11px;height:11px;border-color:var(--ai);border-width:2.5px}
.mk-poi{width:7px;height:7px;background:var(--matcha);border:1.5px solid #fff}
.marker:hover .mk,.marker.on .mk{background:var(--shu);border-color:var(--shu);transform:translate(-50%,-50%) scale(1.5)}
.marker.city.on .mk{transform:translate(-50%,-50%) scale(1.35)}

/* 标签：独立绝对定位（不依赖 marker 的 0×0 参照系），由碰撞检测决定 */
#lbs{position:absolute;inset:0;pointer-events:none;z-index:11}
.lb{
  position:absolute;top:0;left:0;font-size:10.5px;line-height:1.3;color:var(--sumi);
  white-space:nowrap;pointer-events:none;font-weight:500;box-sizing:content-box;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff,0 0 4px #fff;
}
.lb.pk{background:rgba(255,255,255,.84);padding:0 3px;border-radius:2px}
.lb{transition:color .15s,background .15s}
.lb.hov{color:var(--shu);font-weight:700}
.lb.act{color:#fff;background:var(--shu);font-weight:700;border-radius:2px}

/* 拖拽态 */
.mapbox{position:relative}
.mapbox.grabbing{cursor:grabbing}
.mapbox.grabbing .marks{cursor:grabbing}

/* ========== POI 详情卡 ========== */
.poi-panel{padding:16px 20px;border-top:1px solid var(--line);background:var(--paper);display:none}
.poi-panel.on{display:block}
.poi-t{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.poi-t h4{font-size:16px;margin-bottom:3px}
.poi-t .sub{font-size:11.5px;color:var(--sumi-light)}
.poi-t .cl{margin-left:auto;color:var(--sumi-light);font-size:19px;padding:0 6px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}
.kv div{font-size:12.5px}
.kv b{display:block;font-size:10px;letter-spacing:.05em;color:var(--sumi-light);font-weight:600;margin-bottom:2px;text-transform:uppercase}
.kv span{color:var(--sumi)}

/* ========== 路线对比表 ========== */
.rtable{width:100%;border-collapse:collapse;font-size:12.5px}
.rtable th{text-align:left;font-size:10px;letter-spacing:.06em;color:var(--sumi-light);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;text-transform:uppercase}
.rtable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable tr{cursor:pointer;transition:.14s}
.rtable tbody tr:hover{background:var(--paper)}
.rtable tbody tr.on{background:var(--accent-soft)}
.rtable .rn{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center}
.rtable .dot{width:9px;height:9px;border-radius:50%;flex:none}
.stars{color:var(--gold);letter-spacing:1px;font-size:11px;white-space:nowrap}
.crowd{font-size:10.5px;padding:2px 7px;border-radius:9px;white-space:nowrap;display:inline-block}
.c1{background:#E8F0E4;color:#456030}.c2{background:#EAF1F6;color:#2C5470}
.c3{background:#FCF1E4;color:#8A5A20}.c4{background:#FAEAE8;color:#8C2A24}
.yes{color:var(--shu);font-weight:600;font-size:11px}
.no{color:var(--sumi-light);font-size:11px}

/* ========== 行程条 ========== */
.strip{display:flex;height:38px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--washi)}
.strip .seg-d{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;color:#fff;padding:0 3px;overflow:hidden;white-space:nowrap;transition:.16s;cursor:pointer;border-right:1px solid rgba(255,255,255,.28)}
.strip .seg-d:hover{filter:brightness(1.1)}
.strip .seg-d:last-child{border-right:none}
.strip .seg-d.move{background:repeating-linear-gradient(45deg,#CFC7B8,#CFC7B8 5px,#C4BBA9 5px,#C4BBA9 10px);color:#3D3830}
.strip .seg-d.on{outline:2px solid var(--sumi);outline-offset:-2px;z-index:2}
.strip-ax{display:flex;margin-top:5px;font-size:9.5px;color:var(--sumi-light);font-family:var(--f-mono)}
.strip-ax span{flex:1;text-align:center;border-right:1px solid var(--line);padding-bottom:2px}
.strip-ax span:last-child{border-right:none}
.move-ratio{margin-top:9px;font-size:11.5px;color:var(--sumi-light)}

/* ========== 时间轴 ========== */
.tl{position:relative;padding-left:29px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:1.5px;background:var(--line-strong)}
.day{position:relative;margin-bottom:15px}
.day::before{content:"";position:absolute;left:-24px;top:15px;width:9px;height:9px;border-radius:50%;
  background:var(--dc,var(--ai));border:2px solid var(--washi);box-shadow:0 0 0 1.5px var(--dc,var(--ai))}
.day-h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.day-h .dn{font-family:var(--f-mono);font-size:11px;color:var(--dc,var(--ai));font-weight:600;letter-spacing:.04em}
.day-h h4{font-size:14.5px}
.day-h .meta{font-size:11px;color:var(--sumi-light);margin-left:auto;white-space:nowrap}
.day-b{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--washi);font-size:13px}
.it{display:flex;gap:9px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.it:last-child{border-bottom:none}
.it .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--sumi-light);flex:none;width:38px;padding-top:2px}
.it .tx{flex:1;min-width:0}
.it.mv{background:var(--paper);margin:7px -15px;padding:7px 15px;border-radius:var(--r)}
.it.mv .tx{font-size:12px;color:var(--sumi-light)}
.day-cost{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--sumi-light)}
.day-cost b{font-family:var(--f-mono);color:var(--sumi);font-weight:600}

/* ========== 预算 ========== */
.bt{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
.brow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.brow:last-of-type{border-bottom:none}
.brow .lb{flex:1;min-width:0}
.brow .lb small{display:block;color:var(--sumi-light);font-size:10.5px;margin-top:1px}
.brow .v{font-family:var(--f-mono);font-size:14px;font-weight:600;white-space:nowrap}
.brow .v em{font-style:normal;font-size:10.5px;color:var(--sumi-light);font-weight:400;margin-left:5px}
.btot{margin-top:14px;padding:15px;background:var(--sumi);color:#fff;border-radius:var(--r)}
.btot .r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.btot .r:last-child{margin-bottom:0}
.btot .r span{font-size:12.5px;opacity:.8}
.btot .r b{font-family:var(--f-mono);font-size:22px;font-weight:700}
.btot .r.big b{font-size:27px}
.btot .sub{font-size:11px;opacity:.7;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.2);line-height:1.6}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:5px 0 12px;background:var(--line)}
.bar i{display:block;height:100%}
.field{margin-bottom:13px}
.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--sumi-light);margin-bottom:5px}
.field label b{font-family:var(--f-mono);color:var(--sumi)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field select{width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--washi);font-size:13px}
.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:7px}
.cmp th,.cmp td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{font-size:10px;color:var(--sumi-light);text-transform:uppercase;letter-spacing:.05em}
.cmp td b{font-family:var(--f-mono)}
.cmp .rec{background:#F1F6EC}
.cmp .rec td{color:#456030;font-weight:600}

/* ========== 清单 ========== */
.chk{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;width:100%;text-align:left}
.chk:last-child{border-bottom:none}
.chk .bx{width:17px;height:17px;border:1.5px solid var(--line-strong);border-radius:3px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:.16s}
.chk[aria-checked="true"] .bx{background:var(--matcha);border-color:var(--matcha);color:#fff}
.chk[aria-checked="true"] .tx{color:var(--sumi-light);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.chk .tx small{display:block;color:var(--sumi-light);font-size:11px;margin-top:1px;text-decoration:none}

/* ========== 坑 ========== */
.pits{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.pit{border:1px solid var(--line);border-left:3px solid var(--shu);border-radius:var(--r);padding:13px 15px;background:var(--washi)}
.pit h4{font-size:13.5px;margin-bottom:6px;display:flex;gap:7px;align-items:baseline}
.pit h4 .n{font-family:var(--f-mono);font-size:10.5px;color:var(--shu);flex:none}
.pit .bad{font-size:12px;color:#8C2A24;margin-bottom:5px}
.pit .good{font-size:12px;color:#456030}

/* ========== 表格 ========== */
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{text-align:left;padding:9px 10px;background:var(--paper);font-size:10px;letter-spacing:.05em;
  color:var(--sumi-light);text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.dt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dt tr:hover td{background:var(--paper)}
.dt .num{font-family:var(--f-mono);white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}

/* ========== 底部 Tab（移动端） ========== */
.btab{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(250,248,244,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.btab-in{display:flex}
.btab button{flex:1;padding:8px 4px 7px;font-size:10px;color:var(--sumi-light);display:flex;
  flex-direction:column;align-items:center;gap:3px;min-height:var(--bar-h);justify-content:center;transition:.15s}
.btab button .bi{font-size:17px;line-height:1}
.btab button[aria-selected="true"]{color:var(--accent);font-weight:600}

/* ========== Footer ========== */
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0;font-size:11.5px;color:var(--sumi-light);line-height:1.8}
footer b{color:var(--sumi)}
footer .fc{display:flex;gap:26px;flex-wrap:wrap;justify-content:space-between}

/* ========== 响应式 ========== */
@media(max-width:1180px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;max-height:none;display:none}
  .bt{grid-template-columns:1fr}
  #map{height:460px}
}
@media(max-width:768px){
  body{font-size:14.5px}
  .wrap{padding:0 14px;gap:0}
  .main{padding-bottom:calc(var(--bar-h) + 26px)}
  .topbar-in{padding:9px 14px;gap:10px}
  .brand small{display:none}
  .ctrls{width:100%;margin-left:0;gap:9px;padding-bottom:2px}
  .seg button{padding:6px 10px;font-size:12px}
  .btab{display:block}
  .hero{padding:20px 0 18px}
  .hero h1{font-size:22px}
  .hero-stats{gap:17px}
  .hstat b{font-size:16px}
  #map{height:56vh;min-height:330px}
  .card,.pbody{padding:15px 14px}
  .panel{border-radius:var(--r)}
  .phead{padding:13px 14px}
  .scroll{margin:0 -14px;padding:0 14px}
  .pits{grid-template-columns:1fr}
  /* 移动端图例收起为单行摘要，避免遮挡地图 */
  .legend{
    left:9px;right:9px;bottom:9px;max-width:none;padding:6px 10px;font-size:10px;
    display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;
  }
  .legend h4{display:none}
  .legend .lg{margin-top:0}
  .legend .sw{width:11px;height:3px}
  .legend .extra{display:none}
  .map-ovl{gap:4px}
  .mbtn{padding:4px 8px;font-size:11px}
  .kv{grid-template-columns:1fr 1fr}
  .day-h .meta{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media print{
  .topbar,.side,.btab,.mbtn,.legend,.map-ovl{display:none!important}
  .wrap{grid-template-columns:1fr}
  .card,.panel{break-inside:avoid;box-shadow:none}
  .mapbox{display:none}
}

/* ============ 样条 ============ */
function spline(pts, tens=0.5){
  if(pts.length<3) return pts.length===2 ? `M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}` : '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d += ` C${p1[0]+(p2[0]-p0[0])/6*tens},${p1[1]+(p2[1]-p0[1])/6*tens} ${p2[0]-(p3[0]-p1[0])/6*tens},${p2[1]-(p3[1]-p1[1])/6*tens} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const pathOf = cs => spline(cs.map(c => { const g = cityById(c) || c; return [px(g.lng), py(g.lat)]; }));

/* ---------- 标记层（HTML，尺寸恒定） ---------- */
let markerEls = [];   // {el, lng, lat, prio, minZ}

function buildMarkers(){
  const r = S.route ? routeById(S.route) : null;
  const mk = [];

  D.cities.filter(c=>c.region!=='中国').forEach(c => {
    mk.push({

    });
  });
  D.pois.forEach(p => {
    mk.push({
      kind:'poi', id:p.id, lng:p.lng, lat:p.lat, name:p.name,

      ? `<i class="mk mk-city${m.port?' port':''}"></i>`

    return `<div class="marker ${m.kind}${m.active?' on':''}" data-kind="${m.kind}" data-id="${m.id}"
      tabindex="0" role="button" aria-label="${esc(m.title)}" title="${esc(m.title)}">${dot}</div>`;
  }).join('');

  // 标签独立成层：绝对定位于 #lbs（覆盖层坐标系），不受 marker 的 0x0 参照系影响
  const lbs = wrap.querySelector('#lbs');
  lbs.innerHTML = mk.map(m => `<span class="lb" data-for="${m.kind}:${m.id}">${esc(m.name)}</span>`).join('');

  markerEls = mk.map(m => ({
    m, el: wrap.querySelector(`[data-kind="${m.kind}"][data-id="${m.id}"]`),
    lb: lbs.querySelector(`[data-for="${m.kind}:${m.id}"]`)
  }));

  wrap.onclick = e => {
    const el = e.target.closest('.marker'); if(!el) return;
    const kind = el.dataset.kind, id = el.dataset.id;
    if(kind==='poi') pickPoi(id);
    else { pickPoi(null); const c = cityById(id); flyTo(px(c.lng), py(c.lat), 90); }
  };
  wrap.onkeydown = e => {
    if(e.key!=='Enter' && e.key!==' ') return;
    const el = e.target.closest('.marker'); if(!el) return;
    e.preventDefault(); el.click();
  };
  // 悬停：标记置顶 + 对应标签高亮
  wrap.onmouseover = e => {

    if(lb) lb.classList.remove('hov');
  };
}

/* ---------- 标签避让：按优先级贪心放置，冲突则换位；主干城市保底显示 ---------- */
const CAND = [
  [8,3,'start'],[8,3,'end'],[-8,3,'start'],[-8,3,'end'],
  [0,-10,'middle'],[0,16,'middle'],[8,-8,'start'],[-8,-8,'end'],
  [8,16,'start'],[-8,16,'end'],[0,3,'start'],[0,3,'end']
];

function layoutMarkers(){
  const placed = [];
  const W = vp.w, H = vp.h;
  const order = markerEls.slice().sort((a,b)=>a.m.prio - b.m.prio);
  const zoomed = cam.w < 430;          // 放大后才显示次要城市/POI 标签

    // 先把所有标记的可见性与屏幕坐标算好，供本轮标签避让使用
    const pts = markerEls.map(o => {
      const [x,y] = toScreen(o.m.lng, o.m.lat);
      const vis = !(x < -30 || y < -24 || x > W+30 || y > H+24);
      return {o, x, y, vis};
    });
    pts.forEach(p => {
      p.o.el.style.display = p.vis ? '' : 'none';
      p.o.el.style.transform = `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0)`;
      // 不可见标记的标签必须立即隐藏，否则会残留上一帧坐标堆在角落
      if(!p.vis) p.o.lb.style.display = 'none';
    });
    const visiblePts = pts.filter(p => p.vis);

    visiblePts.sort((a,b) => a.o.m.prio - b.o.m.prio).forEach(({o, x:sx, y:sy}) => {

    const lb = o.lb;
    const major = o.m.prio <= 1;                       // 主干城市 / 机场
    const want = major || (zoomed && o.m.kind==='city') || (o.m.active && o.m.kind==='poi');
    if(!want){ lb.style.display='none'; return; }

    // 量测：清掉 pk 背景后量纯文字宽度，避免 padding 干扰
    lb.style.display=''; lb.className='lb';
    lb.style.transform='translate3d(-9999px,-9999px,0)';
    const rb = lb.getBoundingClientRect();
    const w = Math.ceil(rb.width) || Math.ceil(o.m.name.length * 11);
    const h = Math.ceil(rb.height) || 14;
    const PAD = 3;                                       // .lb.pk 左右 padding

    const fits = (bx,by) => {
      if(bx < 2 || by < 2 || bx + w + PAD*2 > W - 2 || by + h > H - 2) return false;
      for(const p of placed){
        if(bx < p.x+p.w && bx+w+PAD*2 > p.x && by < p.y+p.h && by+h > p.y) return false;
      }
      // 避开其他标记圆点（留 7px 呼吸空间）
      for(const p of visiblePts){
        if(p.o===o) continue;
        if(p.x > bx-7 && p.x < bx+w+PAD*2+7 && p.y > by-7 && p.y < by+h+7) return false;
      }
      return true;
    };

    let best = null;
    for(const [dx,dy,anchor] of CAND){
      const ax = anchor==='start' ? dx : anchor==='end' ? dx-w : dx-w/2;
      const bx = sx+ax, by = sy+dy;
      if(fits(bx,by)){ best = {bx,by}; break; }
    }
    // 保底：主干城市 / 已选路线 POI 环形扫描，找重叠面积最小的位置
    // 保底：尽量为每个标签找到不重叠位置（环形扫描），而非直接隐藏
    if(!best){
      let minOv = Infinity, cand = null;
      for(let ring = 9; ring <= 54; ring += 5){
        for(let ang = 0; ang < 360; ang += 20){
          const rad = ang*Math.PI/180;
          const bx = Math.min(Math.max(sx + Math.cos(rad)*ring, 2), Math.max(2, W-w-PAD*2-2));
          const by = Math.min(Math.max(sy + Math.sin(rad)*ring, 2), Math.max(2, H-h-2));
          let ov = 0;
          for(const p of placed){
            const ox = Math.min(bx+w+PAD*2, p.x+p.w) - Math.max(bx, p.x);
            const oy = Math.min(by+h, p.y+p.h) - Math.max(by, p.y);
            if(ox > 0 && oy > 0) ov += ox*oy;
          }
          for(const p of visiblePts){
            if(p.o===o) continue;
            if(p.x > bx-6 && p.x < bx+w+PAD*2+6 && p.y > by-6 && p.y < by+h+6){ ov += 400; break; }
          }
          if(ov < minOv){ minOv = ov; cand = {bx,by}; }
        }
        if(cand && minOv === 0) break;
      }
      // 完全不与已放置标签冲突才采用；否则隐藏，避免任何重叠
      if(cand && minOv === 0) best = cand;
    }
    if(best){
      lb.classList.add('pk');
      if(o.m.active) lb.classList.add('act');
      lb.style.transform = `translate3d(${best.bx.toFixed(1)}px,${best.by.toFixed(1)}px,0)`;
      placed.push({x:best.bx, y:best.by, w:w+PAD*2, h});
    } else {
      lb.style.display='none';
    }
  });
}

function applyCam(){
  const el = $('#map'); if(!el) return;
  el.setAttribute('viewBox', `${cam.x} ${cam.y} ${cam.w} ${cam.h}`);
  const r = el.getBoundingClientRect();
  vp.w = r.width; vp.h = r.height;
  vp.sx = r.width / cam.w;
  vp.sy = r.height / cam.h;
  const c = el.parentElement;
  if(c) c.classList.toggle('zoomed', cam.w < 430);
  layoutMarkers();
}

function zoom(f, cx, cy){
  const nw = Math.max(70, Math.min(1100, cam.w*f)), nh = nw * VB0.h/VB0.w;
  const rx = cx!==undefined ? cx : cam.x+cam.w/2, ry = cy!==undefined ? cy : cam.y+cam.h/2;
  cam = { x:rx-nw/2, y:ry-nh/2, w:nw, h:nh };
  clampCam(); applyCam();
}
function clampCam(){
  const w=VB0.w*1.3, h=VB0.h*1.3;
  cam.x = Math.max(VB0.x-w*0.5, Math.min(VB0.x+VB0.w-w*0.02, cam.x));
  cam.y = Math.max(VB0.y-h*0.5, Math.min(VB0.y+VB0.h-h*0.02, cam.y));
}
function flyTo(x, y, w){
  const to = { x:x-w/2, y:y-w*VB0.h/VB0.w/2, w, h:w*VB0.h/VB0.w };
  const from = {...cam}, t0 = performance.now(), dur = 760;
  if(reduceMotion()){ cam = to; clampCam(); applyCam(); return; }
  (function step(t){
    const k = Math.min(1,(t-t0)/dur), e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    cam = { x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e, w:from.w+(to.w-from.w)*e, h:from.h+(to.h-from.h)*e };
    clampCam(); applyCam();
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
/* 按地点集合自动取包围盒并飞往，避免手写坐标偏移 */
function flyToBounds(list, pad){
  const pts = list.map(g => [px(g.lng), py(g.lat)]);
  if(!pts.length) return;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  // px()/py() 已含 SCALE 因子，直接按跨度换算 viewBox 宽度，不再二次乘
  const w = Math.max(110, Math.max(x1-x0, (y1-y0)*1.32) * (pad||1.3));
  flyTo(cx, cy, w);
}
function reduceMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* ---------- 平移 / 缩放交互 ---------- */
function initPan(){
  const el = $('#map'); if(!el) return;      // 非地图 Tab 时跳过
  const stage = el.closest('.mapbox') || el;
  let drag = null;

  // 落在控制按钮 / 图例上的指针事件不参与拖拽，否则会劫持 click
  const onUI = t => !!(t.closest && t.closest('.map-ovl,.map-ovl-r,.legend'));

  stage.addEventListener('wheel', e => {
    if(onUI(e.target)) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const mx = cam.x + (e.clientX - r.left)/r.width * cam.w;
    const my = cam.y + (e.clientY - r.top)/r.height * cam.h;
    zoom(e.deltaY > 0 ? 1.16 : 1/1.16, mx, my);
  }, {passive:false});

  stage.addEventListener('pointerdown', e => {
    if(onUI(e.target)) return;
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    drag = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false, id:e.pointerId };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('grabbing');
  });
  stage.addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
    const r = el.getBoundingClientRect();
    cam.x = drag.cx - dx * cam.w / r.width;
    cam.y = drag.cy - dy * cam.h / r.height;
    clampCam(); applyCam();
  });
  const end = e => {
    if(!drag) return;
    try { stage.releasePointerCapture(drag.id); } catch(_){}
    drag = null; stage.classList.remove('grabbing');
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('dblclick', e => {
    const r = el.getBoundingClientRect();
    const mx = cam.x + (e.clientX - r.left)/r.width * cam.w;
    const my = cam.y + (e.clientY - r.top)/r.height * cam.h;
    zoom(1/1.9, mx, my);
  });
}

/* ============ 预算引擎 ============ */
function calc(){
  const T = TIERS[S.tier], SF = SEASON_F[S.season];
  const adults = S.people>=2 ? Math.ceil(S.people/2) : 1;
  const kids = S.people>=3 ? S.people-2 : 0;
  const n = S.people;

  const flightBase = 60000;
  const flight = flightBase * SF.flight * (S.season==='winter' ? .85 : 1);

  const rooms = S.tier==='economy' ? Math.max(1,Math.ceil(n/2)) : Math.max(1,Math.ceil(n/2));
  const hn = S.days-1;
  const hotel = T.hotel * SF.hotel * hn * rooms * (n>1?1.35:1);

  let pass = 0;
  if(S.route){
    const r = routeById(S.route);
    const far = r.cities.some(c=>['FKU','KUM','KZU','FUK','ASO','YUF','KMH','KMY','NZO','TSM'].includes(c));
    pass = far ? 53000*n : 18000*n;
  }
  const local = S.days * 3200 * n;
  const transport = local + pass;

  const food = T.food * S.days * n;
  const tickets = S.tier==='comfort' ? 30000*n : 15000*n;
  const misc = T.misc*n + 1300;
  const total = flight + hotel + transport + food + tickets + misc;

  const items = [
    ['往返机票（厦门出发）', flight, `¥60,000 基准 × 季节系数 ${SF.flight}`],
    ['住宿 ' + hn + ' 晚', hotel, `¥${(T.hotel).toLocaleString()}/晚 × ${rooms} 间 × 季节 × ${SF.hotel}`],
    ['境内交通 + ' + (pass? 'JR Pass':'地区通票'), transport, `市内日均 ¥3,200 × ${S.days} 日` + (pass? ` + JR Pass ${pass}` : '')],
    ['餐饮 ' + S.days + ' 日', food, `¥${T.food.toLocaleString()}/日 × ${T.food!==TIERS.economy.food?'舒适':'经济'}档`],
    ['门票与体验', tickets, S.tier==='comfort'?'舒适档含工房见学':'经济档以免费庭园为主'],
    ['杂项（保险/流量卡/宅急便/签证）', misc, '含签证费 ¥715（使馆）+ 代办约 ¥600']
  ];
  return { items, total, perDay: total/S.days, hn, rooms, pass, adults, kids };
}

/* ---------- 行程视图 ---------- */
function vItin(){
  const S3 = S.trip;
  const totalDays = S3.reduce((a,b)=>a+b.days,0);
  const moveDays = S3.filter(s=>s.move).length;
  const ratio = totalDays ? Math.round(moveDays/totalDays*100) : 0;
  const strip = S3.map((s,i)=>{
    const c = s.move ? 'move' : '';
    const lbl = s.move ? '移动' : 'D'+(s.days);
    return `<div class="seg-d ${c}" data-i="${i}" style="${s.move?'':'background:'+s.color+'22;color:'+s.color+';border-right-color:'+s.color+'44'}">${esc(lbl)}</div>`;
  }).join('');
  const ax = S3.map(s=>`<span>D${s.from}</span>`).join('');

  const cards = S3.map((s,i)=>{
    const r = s.route ? routeById(s.route) : null;
    return `<div class="day" style="--dc:${s.color}">
      <div class="day-h"><span class="dn">${s.move?'移动日':'DAY '+s.from+'–'+(s.from+s.days-1)}</span>
        <h4>${esc(s.name)}</h4>
        ${r?`<span class="meta">${esc(r.theme)}</span>`:''}</div>
      <div class="day-b">
        ${s.note?`<div style="font-size:12.5px;color:var(--sumi-light);margin-bottom:8px">${esc(s.note)}</div>`:''}
        <div style="font-size:12.5px;color:var(--sumi-light);line-height:1.8">
          途经：${r ? r.cities.map(c=>esc((cityById(c)||{}).name||c)).join(' → ') : '—'}<br>
          覆盖景点：${r ? r.pois.length : 0} 个 · 建议预算 ${yen(Math.round(calc().perDay*s.days*0.9))} /人
        </div>
      </div>
    </div>`;
  }).join('');

  const warn = [];
  const hotels = S3.filter(s=>!s.move).length;
  if(totalDays>S.days) warn.push(['a-dang','⚠️',`已选路线共 ${totalDays} 天，超过你的 ${S.days} 天预算，请调整。`]);
  if(hotels>=4) warn.push(['a-warn','⚠️',`连续换酒店 ${hotels} 次。日本城市间移动平均 2–3.5 小时，频繁换酒店会大量时间耗在路上。`]);
  if(ratio>30) warn.push(['a-warn','⚠️',`移动日占比 ${ratio}%，偏高（建议 ≤30%）。`]);

  return `
  <div class="panel">
    <div class="phead"><h3>行程编排</h3><span class="sub">从「路线」页加入片段，或点击下方快捷框架</span></div>
    <div class="pbody">
      ${S3.length ? `
        <div class="strip">${strip}</div>
        <div class="strip-ax">${ax}</div>
        <div class="move-ratio">共 ${totalDays} 日 · ${moveDays} 日在移动（${ratio}%）· 住宿 ${hotels} 段</div>
        ${warn.map(w=>`<div class="alert ${w[0]}" style="margin-top:12px"><span class="ai">${w[1]}</span><div>${w[2]}</div></div>`).join('')}
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="mbtn" id="tClr">清空行程</button>
          <button class="mbtn" id="tPrint">打印 / 导出 PDF</button>
          <button class="mbtn" id="tCopy">复制为 Markdown</button>
        </div>`
      : `<div class="alert a-info" style="margin:0"><span class="ai">🧭</span><div>还没有行程片段。到「路线」页选一条路线点「加入我的行程」，或直接用下方三个 18 日框架。</div></div>`}
    </div>
  </div>
  ${frames()}
  ${cards ? `<div class="panel"><div class="phead"><h3>逐日时间轴</h3></div><div class="pbody"><div class="tl">${cards}</div></div></div>` : ''}`;

/* ============ 交互 ============ */
function pickRoute(id){
  S.route = S.route===id ? null : id;
  S.poi = null;
  renderSide();
  render();
  if(S.tab==='map'){
    const r = routeById(id);
    if(r){
      const cs = r.cities.map(c=>cityById(c)).filter(Boolean);
      if(cs.length) flyToBounds(cs, 1.18);
    }
  }
}
function pickPoi(id){
  S.poi = id;
  $$('#marks .marker[data-kind="poi"]').forEach(m=>m.classList.toggle('on', m.dataset.id===id));
  const p = poiById(id);
  if(p){
    $('#poiPanel').innerHTML = poiPanel(p);
    $('#poiPanel').classList.add('on');
    bindMapPanel();
    // 移动端：详情在地图下方，滚动到可见处
    if(window.innerWidth < 1180) $('#poiPanel').scrollIntoView({behavior: reduceMotion()?'auto':'smooth', block:'nearest'});
  }
}
function addToTrip(id){
  const r = routeById(id);
  if(!r) return;
  let from = 1;
  S.trip.forEach(s => { from += s.days; });
  S.trip.push({ route:id, name:r.name, days:r.days, from, color:r.color, move:false, note:r.star });
  if(from>1) S.trip.push({ route:null, name:'移动日（新干线 / 特急）', days:1, from:from, color:'#CFC7B8', move:true, note:'平均 2–3.5 小时，含进出站时间' });
  S.trip.sort((a,b)=>a.from-b.from);
  S.trip.forEach((s,i)=>{ if(!s.move) s.from = S.trip.slice(0,i).filter(x=>!x.move).reduce((a,b)=>a+b.days,1); });
  S.trip = S.trip.filter((s,i,a)=> !(i===0 && s.move));
  render();
}
function bindTrip(){
  $$('[data-load]').forEach(b => b.onclick = () => { S.days = +b.dataset.load; S.tab='budget'; renderNav(); render(); });
  const c = $('#tClr'); if(c) c.onclick = () => { S.trip=[]; render(); };
  const p = $('#tPrint'); if(p) p.onclick = () => window.print();
  const cp = $('#tCopy'); if(cp) cp.onclick = () => {
    const md = S.trip.map(s=>`## ${s.move?'移动':'DAY '+s.from}｜${s.name}\n${s.note||''}`).join('\n\n');
    navigator.clipboard?.writeText(md).then(()=>{ cp.textContent='已复制 ✓'; setTimeout(()=>cp.textContent='复制为 Markdown',1600); });
  };
  $$('.strip .seg-d').forEach(d => d.onclick = () => {
    $$('.strip .seg-d').forEach(x=>x.classList.remove('on')); d.classList.add('on');
    const s = S.trip[+d.dataset.i];
    if(s.route){ S.tab='routes'; renderNav(); render(); }
  });
}
function bindBudget(){
  const r = $('#rDays'); if(r) r.oninput = () => { S.days = +r.value; render(); };
  const s = $('#selP2'); if(s) s.onchange = () => { S.people = +s.value; $('#selPeople').value = s.value; render(); };
}
function bindVisa(){
  if(!$('#vlist')) return;
  const done = JSON.parse(localStorage.getItem('wbd_v') || '[]');
  $$('#vlist .chk').forEach(c => {
    const i = +c.dataset.i;
    c.setAttribute('aria-checked', done.includes(i));
    c.onclick = () => {
      const on = c.getAttribute('aria-checked')==='true';
      c.setAttribute('aria-checked', !on);
      const d = JSON.parse(localStorage.getItem('wbd_v') || '[]');
      const arr = on ? d.filter(x=>x!==i) : [...d,i];
      localStorage.setItem('wbd_v', JSON.stringify(arr));
      updProg();
    };
  });
  updProg();
}
function updProg(){
  const n = $$('#vlist .chk[aria-checked="true"]').length;
  const el = $('#vProg'); if(el) el.textContent = `已完成 ${n} / ${VCHECK.length}`;
}
function bindRoutes(){
  if(!$('.rtable')) return;
  // 事件委托：表格整体重绘后依然有效，不依赖逐行绑定
  const tb = $('.rtable tbody');
  if(tb && !tb.dataset.bound){
    tb.dataset.bound = '1';
    tb.addEventListener('click', ev => {
      const tr = ev.target.closest('tr[data-r]');
      if(tr) pickRoute(tr.dataset.r);
    });
  }
  const l = $('#rLocate'); if(l) l.onclick = () => { S.tab='map'; renderNav(); render(); };
  const a = $('#rAdd'); if(a) a.onclick = () => addToTrip(S.route);
  const pp = $('#rPoi'); if(pp) pp.onclick = () => { S.tab='map'; renderNav(); render(); };
}

/* 逐个容错绑定：任一模块缺失元素都不应影响其他模块 */
function boot(){
  [bindMapPanel, bindTrip, bindBudget, bindVisa, bindRoutes].forEach(fn => {
    try { fn(); } catch(e) { /* 元素不存在时静默跳过 */ }
  });
}

/* ============ 启动 ============ */
function init(){
  document.documentElement.style.setProperty('--accent', SEASONS[S.season].accent);
  document.documentElement.style.setProperty('--accent-soft', SEASONS[S.season].accent+'1a');
  const u = new URLSearchParams(location.search);
  if(u.get('season')) { S.season = u.get('season'); mode = S.season; }
  if(u.get('route')) S.route = u.get('route');
  $$('#segSeason button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.v===S.season); b.onclick = () => {
    S.season = b.dataset.v; mode = S.season;
    $$('#segSeason button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    document.documentElement.style.setProperty('--accent', SEASONS[S.season].accent);
    document.documentElement.style.setProperty('--accent-soft', SEASONS[S.season].accent+'1a');
    renderSide(); render(); bindMapPanel();
  }; });
  $$('#segTier button').forEach(b => b.onclick = () => {
    S.tier = b.dataset.v;
    $$('#segTier button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    renderSide(); render();
  });
  $('#selPeople').onchange = e => { S.people = +e.target.value; render(); };
  renderNav(); renderSide(); render();
  window.addEventListener('popstate', () => location.reload());
}
init();
</script>
